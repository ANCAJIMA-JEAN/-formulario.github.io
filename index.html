<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formulario Google Sheets</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#fff;padding:24px;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.15);width:360px}
h2{text-align:center}input,button{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
button{background:#1a73e8;color:#fff;border:none;border-radius:6px;cursor:pointer}
#msg{text-align:center;margin-top:10px}
</style></head><body>
<div class="card">
<h2>Registro</h2>
<form id="f">
<input id="nombre" placeholder="Nombre" required>
<input id="dni" placeholder="DNI" required>
<input id="cargo" placeholder="Cargo">
<input id="telefono" placeholder="Teléfono">
<button>Guardar</button>
</form>
<div id="msg"></div>
</div>
<script>
const SCRIPT_URL="PEGA_AQUI_TU_URL_DEL_APPS_SCRIPT";
const f=document.getElementById("f"),msg=document.getElementById("msg");
f.onsubmit=async(e)=>{
e.preventDefault();
msg.textContent="Enviando...";
const datos={
nombre:nombre.value,dni:dni.value,cargo:cargo.value,telefono:telefono.value
};
try{
const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(datos)});
if(!r.ok) throw new Error();
msg.textContent="✅ Registro guardado";
f.reset();
}catch(err){
msg.textContent="❌ Error. Revisa la URL del Apps Script.";
}
};
</script></body></html>
